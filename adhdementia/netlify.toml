# Netlify configuration for the ADHDementia site.
#
# This lives at the root of the adhdementia repository, so there is no base
# directory to set and no build step to run. See DEPLOY.md.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long cache for the brand assets, which never change under the same filename.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# The tools hold people's work in localStorage, so they must never be served
# stale after an update.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
